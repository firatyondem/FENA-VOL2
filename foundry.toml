[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"
optimizer = true
# Base Sepolia does not support every opcode of the newest EVM versions yet.
evm_version = "cancun"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
  { access = "read", path = "./shared" },
  { access = "read-write", path = "./shared/deployments" },
]
ignored_warnings_from = ["lib"]

[fuzz]
runs = 1000

[fmt]
line_length = 120
